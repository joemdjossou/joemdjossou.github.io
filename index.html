    <!-- SPA fallback decoder: restores the clean path encoded by 404.html
         (rafgraph/spa-github-pages) before React boots. Must run first. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
