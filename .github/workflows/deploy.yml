name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Re-deploy every morning so the GitHub contribution graph and repo cards on
  # the home page stay current without anyone pushing a commit.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Regenerates src/data/github.json. The committed copy is the fallback, so
      # a hiccup here degrades to yesterday's numbers instead of failing the build.
      - name: Refresh GitHub data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/fetch-github.mjs

      - name: Build
        run: bun run build

      - name: List build output
        run: |
          echo "=== Build output directory contents ==="
          ls -la ./dist/
          echo "=== index.html content preview ==="
          head -10 ./dist/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: joemdjossou.com
